[workspace]
members = [
    "crates/backend-trait",
    "crates/daemon-core",
    "crates/backends/llama-backend",
    "crates/backends/sd-backend",
    "crates/backends/mesh-backend",
    "crates/backends/whisper-backend",
    "crates/backends/tts-backend",
    "crates/backends/video-backend",
    "crates/moe-cache",
    "crates/spec-decode",
    "crates/pool-protocol",
    "crates/proto",
    "crates/client-sdk",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["AIATM Team"]
license = "MIT OR Apache-2.0"

[workspace.dependencies]
tokio = { version = "1.38", features = ["full"] }
async-trait = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
axum = "0.7"
tonic = "0.12"
prost = "0.13"
bytes = "1.6"
futures = "0.3"
