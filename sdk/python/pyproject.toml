[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aiatm-sdk"
version = "0.1.0"
description = "Python Client SDK for AIATM Local Inference Daemon"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "requests>=2.28.0",
    "grpcio>=1.50.0",
    "protobuf>=4.21.0"
]
